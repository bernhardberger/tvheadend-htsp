version: 2

# Bot PRs are expected to fail CI until a maintainer regenerates
# gradle/verification-metadata.xml with --write-verification-metadata pgp,sha256
# --export-keys and reviews the keys; never trust new keys blindly.
# kotlin-stdlib and kotlinx-coroutines (with its org.jetbrains:annotations) are
# consumer-visible: also update the exact pins in build.gradle.kts
# (verifyProductionDependencyGraph) and tools/check-published-jvm-compatibility,
# and state a higher Kotlin minimum in the release notes (docs/versioning.md).
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "build(deps)"

updates:
  - package-ecosystem: gradle
    directories: ["/", "/consumer-contract"]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    rebase-strategy: disabled
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    rebase-strategy: disabled
