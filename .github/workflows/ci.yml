name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Only superseded runs of the same PR share a group; every main run is unique.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || github.repository != 'bernhardberger/tvheadend-htsp' }}
          # Enhanced caching supports exclusions; never restore test task outputs.
          cache-provider: enhanced
          gradle-home-cache-excludes: |
            caches/build-cache-*
            caches/keyrings
          # The dedicated wrapper validation step above remains mandatory.
          validate-wrappers: false
      - name: Verify publication checker self-tests
        run: ./tools/check-published-jvm-compatibility --self-test
      - name: Build and stage publication
        run: ./gradlew --no-daemon clean build check stageLocalPublication
      - name: Verify staged JVM publication
        run: ./tools/check-published-jvm-compatibility
      - name: Verify consumer contract
        run: ./gradlew --no-daemon -p consumer-contract clean test verifyConsumerDependencyGraph
