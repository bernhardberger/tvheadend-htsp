name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Set up Temurin 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and stage publication
        run: ./gradlew --no-daemon clean build check stageLocalPublication
      - name: Verify protocol evidence
        run: |
          python3 docs/htsp-protocol/report.py --check
          python3 docs/htsp-protocol/generate_typed_requests.py --self-test
          python3 docs/htsp-protocol/generate_typed_request_models.py --self-test
          python3 docs/htsp-protocol/generate_typed_server_messages.py --self-test
          python3 docs/htsp-protocol/generate_typed_server_message_models.py --self-test
      - name: Verify generated sources
        run: ./tools/check-htsp-generated-drift
      - name: Verify staged JVM publication
        run: ./tools/check-published-jvm-compatibility
      - name: Verify consumer contract
        run: ./gradlew --no-daemon -p consumer-contract clean compileKotlin verifyConsumerDependencyGraph
