name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'bernhardberger/tvheadend-htsp' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: central
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Set up Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and stage publication
        run: ./gradlew --no-daemon clean build check stageLocalPublication
      - name: Verify staged JVM publication
        run: ./tools/check-published-jvm-compatibility
      - name: Verify staged consumer contract
        run: ./gradlew --no-daemon -p consumer-contract clean test verifyConsumerDependencyGraph
      - name: Check release setup
        run: ./tools/publish-central-release --check-setup
      - name: Sign, publish, and verify Central
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: ./tools/publish-central-release --publish
      - name: Finalize GitHub prerelease from verified outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-central-release --finalize-github-release
